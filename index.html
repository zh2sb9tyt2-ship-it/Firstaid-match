<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Aid Match เกมจับคู่ศัพท์ปฐมพยาบาล</title>
<style>
:root{--bg:#f4f8fc;--tx:#12263a;--card:#2b8de0;--en:#fff;--th:#e6f7ea;--bd:#b6d6f2;--ok:#2e9e5b;--mut:#5a7186;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b27;--tx:#e8f1f9;--card:#1f6fb5;--en:#1c2f42;--th:#183626;--bd:#2d4a66;--ok:#4cc27f;--mut:#9ab2c6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;padding:14px;max-width:560px;margin:auto}
h1{font-size:20px;margin:6px 0}
p.s{color:var(--mut);font-size:13px;margin:0 0 10px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px}
button{background:var(--card);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.c{aspect-ratio:3/4;border-radius:10px;border:2px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:3px;font-size:12px;line-height:1.25;background:var(--card);color:#fff;font-size:22px;cursor:pointer}
.c.open{background:var(--en);color:var(--tx);font-size:12px;font-weight:600}
.c.open.th{background:var(--th)}
.c.done{border-color:var(--ok);opacity:.85}
.c small{font-weight:400;color:var(--mut);margin-top:3px;font-size:10px}
#msg{margin:12px 0;font-size:14px;min-height:40px}
.legend{font-size:12px;color:var(--mut)}
</style></head><body>
<h1>🩹 First Aid Match</h1>
<p class="s">พลิกการ์ดจับคู่ ศัพท์อังกฤษ ↔ ความหมายไทย (ขาว = อังกฤษ, เขียว = ไทย)</p>
<div class="bar"><span id="st">พลิกแล้ว 0 ครั้ง · จับคู่ 0/8</span><button onclick="newGame()">เริ่มรอบใหม่ 🔀</button></div>
<div class="grid" id="g"></div>
<div id="msg"></div>
<p class="legend">ศัพท์ทั้งหมด 22 คำ สุ่มมารอบละ 8 คำ</p>
<script>
const W=[["CPR","ซี-พี-อาร์","การปั๊มหัวใจและการหายใจช่วย"],["AED","เอ-อี-ดี","เครื่องกระตุกหัวใจไฟฟ้า"],["First Aid","เฟิร์สท์ เอิด","การปฐมพยาบาลเบื้องต้น"],["Choking","โชค-คิง","การสำลัก"],["Burns","เบิร์นส์","แผลไหม้"],["Wound","วูนด","แผล"],["Bleeding","บลีด-ดิ้ง","การเสียเลือด"],["Shock","ช็อค","การช็อค"],["Fracture","แฟรก-เชอร์","กระดูกหัก"],["Sprain","สเปรน","เคล็ดขัดยอก"],["Heat Stroke","ฮีท สโตรค","การเป็นลมจากความร้อน"],["Hypothermia","ไฮโพ-เธอร์-เมีย","ภาวะอุณหภูมิร่างกายต่ำเกินไป"],["Bandage","แบน-ดิช","ผ้าพันแผล"],["Splint","สปลินต์","อุปกรณ์ดามกระดูก"],["Gloves","กลัฟส์","ถุงมือ"],["Sterile","สเตอ-ไรล์","ปราศจากเชื้อ"],["Hemorrhage","เฮม-มอร์-เรจ","การตกเลือด"],["Consciousness","คอน-เชียส-เนส","การรู้สึกตัว"],["Unconsciousness","อัน-คอน-เชียส-เนส","การหมดสติ"],["Triage","ทรี-อาจ","การจัดลำดับความสำคัญของผู้บาดเจ็บ"],["Rescue Breathing","เรส-คิว บรีธ-อิ้ง","การช่วยหายใจ"],["R.I.C.E","อาร์-ไอ-ซี-อี","การรักษาแผลเคล็ดขัดยอก (พัก ประคบเย็น กด ยก)"]];
let cards=[],open=[],flips=0,matched=0,lock=false;
const g=document.getElementById('g');
function newGame(){
  const pick=[...W].sort(()=>Math.random()-.5).slice(0,8);
  cards=[];pick.forEach((w,i)=>{cards.push({p:i,t:w[0],r:w[1],th:false,s:'en'});cards.push({p:i,t:w[2],r:'',th:true,s:'th'})});
  cards.sort(()=>Math.random()-.5);open=[];flips=0;matched=0;lock=false;
  document.getElementById('msg').textContent='';render();
}
function render(){
  g.innerHTML='';
  cards.forEach((c,i)=>{
    const d=document.createElement('div');
    const show=c.open||c.done;
    d.className='c'+(show?' open':'')+(show&&c.th?' th':'')+(c.done?' done':'');
    d.innerHTML=show?c.t+(c.done&&!c.th?'<small>'+c.r+'</small>':''):'?';
    d.onclick=()=>flip(i);g.appendChild(d);
  });
  document.getElementById('st').textContent='พลิกแล้ว '+flips+' ครั้ง · จับคู่ '+matched+'/8';
}
function flip(i){
  const c=cards[i];if(lock||c.open||c.done)return;
  c.open=true;open.push(i);flips++;render();
  if(open.length===2){
    const[a,b]=open.map(k=>cards[k]);lock=true;
    if(a.p===b.p){a.done=b.done=true;a.open=b.open=false;matched++;open=[];lock=false;
      const w=W.find(x=>x[0]===(a.th?b.t:a.t));
      document.getElementById('msg').textContent='✅ '+w[0]+' ('+w[1]+') = '+w[2];
      render();
      if(matched===8)document.getElementById('msg').textContent='🎉 ครบแล้ว! ใช้ '+flips+' ครั้ง กด "เริ่มรอบใหม่" เพื่อเล่นชุดคำศัพท์อื่น';
    }else{setTimeout(()=>{a.open=b.open=false;open=[];lock=false;render()},900)}
  }
}
newGame();
</script></body></html>
